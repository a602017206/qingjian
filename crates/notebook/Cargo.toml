[package]
name = "notebook-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
csv = "1"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
scraper = "0.24"
ego-tree = "0.10"
walkdir = "2"
url = "2"
percent-encoding = "2"
tiny_http = "0.12"

[target.'cfg(target_os = "ios")'.dependencies]
libz-sys = { version = "1", features = ["static"] }

[dev-dependencies]
tempfile = "3"
