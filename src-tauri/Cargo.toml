[package]
name = "qingjian"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "qingjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-dialog = "~2.8.0"
tauri-plugin-fs = "~2.7.0"
tauri-plugin-opener = "~2.5.0"
serde_json = "1"
notebook-core = { path = "../crates/notebook" }
