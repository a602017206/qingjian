[package]
name = "qingjian"
version = "0.0.7"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
credential-smoke = []

[lib]
name = "qingjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-dialog = "~2.8.0"
tauri-plugin-fs = "~2.7.0"
tauri-plugin-opener = "~2.5.0"
serde_json = "1"
notebook-core = { path = "../crates/notebook" }
keyring-core = "1.0.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri = { version = "~2.12.0", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[dev-dependencies]
tempfile = "3"
