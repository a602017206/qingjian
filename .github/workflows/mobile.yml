name: 安卓与苹果移动端构建
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    name: 安卓调试安装包
    runs-on: ubuntu-24.04
    steps:
      - name: 读取项目
        uses: actions/checkout@v4
      - name: 配置运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 配置原生编译工具
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: 配置安卓编译环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置安卓工具
        uses: android-actions/setup-android@v3
      - name: 安装安卓平台与原生工具
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: 缓存编译结果
        uses: Swatinem/rust-cache@v2
      - name: 安装界面依赖
        run: npm ci
      - name: 生成原生安卓工程
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: 构建安卓应用
        run: npm run mobile:android
      - name: 保存安卓安装包
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  ios:
    name: 苹果移动端模拟器应用
    runs-on: macos-15
    steps:
      - name: 读取项目
        uses: actions/checkout@v4
      - name: 配置运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 配置原生编译工具
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: 缓存编译结果
        uses: Swatinem/rust-cache@v2
      - name: 安装界面依赖
        run: npm ci
      - name: 生成原生苹果工程
        run: npm run tauri -- ios init --ci --skip-targets-install
      - name: 构建模拟器应用
        run: npm run mobile:ios
      - name: 打包模拟器应用
        run: python3 scripts/package-ios.py
      - name: 保存模拟器安装文件
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-ios-simulator
          path: artifacts/qingjian-ios-simulator.zip
          if-no-files-found: error
