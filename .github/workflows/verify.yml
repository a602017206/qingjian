name: 共享核心与界面验证
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: 存储同步与界面验证
    runs-on: ubuntu-24.04
    steps:
      - name: 读取项目
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: 配置运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 配置编译工具
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: 缓存共享核心
        uses: Swatinem/rust-cache@v2
      - name: 安装界面依赖
        run: npm ci
      - name: 检查格式与界面
        run: |
          cargo fmt --all -- --check
          npm run check
          npm test
          npm run build
          node scripts/check-docs.mjs
      - name: 验证共享核心
        run: |
          cargo test --locked -p notebook-core
          cargo clippy --locked -p notebook-core --all-targets -- -D warnings
          rustc --test src-tauri/src/desktop_actions.rs -o /tmp/qingjian-desktop-actions
          /tmp/qingjian-desktop-actions
      - name: 安装中文测试字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安装测试浏览器
        run: npx playwright install --with-deps chromium
      - name: 验证完整界面流程
        run: |
          npm run test:e2e
          npm run test:e2e:database
          npm run test:e2e:import-layout
          npm run test:e2e:trash
          npm run test:e2e:notion-hierarchy
          npm run test:e2e:selection
          npm run test:e2e:notion-html
          npm run test:e2e:record-page
          npm run test:e2e:property-menu
          npm run test:e2e:property-types
          npm run test:e2e:database-interaction
          npm run test:e2e:property-anchor
          npm run test:e2e:page-links
          npm run test:e2e:markdown-paste
          npm run test:e2e:database-views
          npm run test:e2e:editor
          npm run test:e2e:updates
          npm run test:e2e:mobile
          npm run test:e2e:sync-setup
          npm run test:e2e:sync-conflicts
          npm run test:e2e:credentials
          npm run test:e2e:gitee
          npm run test:e2e:auto-sync
          npm run test:e2e:database-batch
          npm run test:e2e:editor-stability
          npm run test:e2e:editor-ime
          npm run test:e2e:desktop-window
      - name: 保存界面验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-verification
          path: test-results/
